name: stage-image

# Baut das OmniRoute-Stage-Entwicklungsimage als Artifact auf einem
# GitHub-hosted Runner, damit der 12-GiB-Produktionshost den RAM-Peak
# des Webpack-Builds (~8-9 GiB RSS+Swap) nie sehen muss.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch oder Tag im Fork, dessen Quellbaum gebaut wird"
        required: true
        default: "stage/antigravity-search"
      expected_commit:
        description: "Exakter erwarteter Commit (SHA-40); verhindert silent drift"
        required: true
        default: "18bbb101980c639cfabdc5663213836d917c3269"
      image_tag:
        description: "Lokales Tag fuer das erzeugte Docker-Image"
        required: true
        default: "3.8.51-dev-18bbb1019"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          repository: sprintberlin/OmniRoute
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify pinned commit and inputs
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_commit must be a lowercase SHA-40"; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "::error::image_tag contains unsafe characters"; exit 1; }
          HEAD="$(git rev-parse HEAD)"
          echo "Checked out HEAD: $HEAD"
          if [ "$HEAD" != "$EXPECTED_COMMIT" ]; then
            echo "::error::source_ref HEAD ($HEAD) differs from expected_commit ($EXPECTED_COMMIT)" >&2
            exit 1
          fi

      - name: Build image (upstream Docker defaults)
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          docker build \
            --label org.opencontainers.image.revision="$EXPECTED_COMMIT" \
            --label org.opencontainers.image.source="https://github.com/sprintberlin/OmniRoute" \
            --label net.sprintcx.omniroute.build=stage-dev \
            --tag "sprintcx/omniroute:$IMAGE_TAG" \
            .

      - name: Export and checksum image
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p build-out
          docker save "sprintcx/omniroute:$IMAGE_TAG" | gzip -1 > build-out/stage-image.tar.gz
          (
            cd build-out
            sha256sum stage-image.tar.gz > stage-image.tar.gz.sha256
            jq -n \
              --arg source_ref "$SOURCE_REF" \
              --arg expected_commit "$EXPECTED_COMMIT" \
              --arg image_tag "$IMAGE_TAG" \
              '{source_ref:$source_ref,expected_commit:$expected_commit,image_tag:$image_tag}' \
              > stage-image.json
          )
          cat build-out/stage-image.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-stage-image
          path: build-out/
          retention-days: 7
          compression-level: 0
